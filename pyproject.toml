[project]
name = "dbnsfp-rag"
version = "0.1.0"
description = "RAG pipeline for dbNSFP variant annotation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.0",
    "requests>=2.31.0",
    "ollama>=0.1.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dbnsfp-ingest = "src.ingest:main"
dbnsfp-query = "src.rag:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
