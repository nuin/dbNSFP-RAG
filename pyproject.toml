[project]
name = "dbnsfp-rag"
version = "0.1.0"
description = "RAG pipeline for dbNSFP variant annotation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
faiss = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
llm = [
    "ollama>=0.1.0",
    "llama-cpp-python>=0.3.0",
]
dev = [
    "ipython>=8.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]
all = [
    "dbnsfp-rag[faiss,api,llm]",
    "pyarrow>=14.0.0",
]

[tool.pytest.ini_options]
testpaths = ["validation/test_suite"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "requires_model: marks tests that require the ML model",
    "requires_database: marks tests that require the vector database",
    "integration: marks integration tests",
]
addopts = "-v --tb=short"

[project.scripts]
dbnsfp-ingest = "src.ingest:main"
dbnsfp-query = "src.rag:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
