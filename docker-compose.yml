# ACMG Variant Classification API with Ollama
#
# Usage (CPU-only, works on any VM):
#   docker-compose up -d
#
# The API will be available at http://localhost:8000
# Ollama will be available at http://localhost:11434
#
# Note: First startup pulls llama3.2:3b model (~2GB), may take several minutes

services:
  ollama:
    image: ollama/ollama:latest
    container_name: acmg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # No GPU requirements - runs on CPU

  ollama-init:
    image: ollama/ollama:latest
    container_name: acmg-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:3b"]
    environment:
      - OLLAMA_HOST=ollama:11434
    network_mode: "service:ollama"
    restart: "no"

  api:
    build: .
    container_name: acmg-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=ollama:11434
      - DBNSFP_DEVICE=cpu
      - ACMG_MODEL_PATH=  # Empty = use Ollama
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_data:
