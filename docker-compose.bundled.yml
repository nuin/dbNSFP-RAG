# Docker Compose for bundled ACMG API with LLM
#
# Usage:
#   docker compose -f docker-compose.bundled.yml up
#
# Or build and run:
#   docker compose -f docker-compose.bundled.yml up --build

services:
  acmg-api:
    build:
      context: .
      dockerfile: Dockerfile.bundled
    image: acmg-api:bundled
    container_name: acmg-classifier
    ports:
      - "8000:8000"
    environment:
      # LLM settings
      - LLM_N_THREADS=4          # Adjust based on CPU cores
      - LLM_N_CTX=4096           # Context window size
      - USE_BUNDLED_LLM=true
      # Database settings
      - ACMG_DB_PATH=/app/data/vectordb/grch37-ngsgenes
      - DBNSFP_DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 8G  # Model needs ~4GB, plus overhead
        reservations:
          memory: 4G
